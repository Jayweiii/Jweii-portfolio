name: Build résumé PDF

# Edit resume/resume.tex (even in the GitHub web editor) and this rebuilds
# public/resume/Jason-Wei-Resume.pdf and commits it to the same branch.
on:
  push:
    paths:
      - "resume/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with pdflatex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          latexmk_use_lualatex: false

      - name: Copy into the site
        run: cp resume/resume.pdf public/resume/Jason-Wei-Resume.pdf

      - name: Commit the PDF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume/Jason-Wei-Resume.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "Rebuild résumé PDF from resume/resume.tex"
            git push
          fi
